server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: postgres
    password: postgres
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
    jwt-secret: ${JWT_SECRET:dev-secret-key-at-least-32-bytes-long!!}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
