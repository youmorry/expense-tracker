server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: postgres
    password: postgres
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

app:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
    # Base64-encoded secret key (generate with: openssl rand -base64 32)
    jwt-secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktYXQtbGVhc3QtMzItYnl0ZXMh}
    jwt-issuer: ${JWT_ISSUER:https://expense-tracker.example.com}
    jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
