version: 2

updates:
  # Gradle (backend)
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels:
      - dependencies
      - backend
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      google:
        patterns:
          - "com.google*"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework*"
          - "org.testcontainers*"
          - "com.google*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Docker
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    labels:
      - dependencies
    open-pull-requests-limit: 3
    groups:
      all:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
