name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend-ci.yml"

  openapi-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI (Spectral)
        run: npx @stoplight/spectral-cli lint openapi.yaml

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4.8.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Check format (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check style (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Compile
        run: ./gradlew classes testClasses integrationTestClasses

      - name: Unit test
        run: ./gradlew test

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Build
        run: ./gradlew build

  backend-result:
    needs: [detect-changes, openapi-lint, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.openapi-lint.result }}" == "failure" || "${{ needs.openapi-lint.result }}" == "cancelled" ]]; then
            exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" == "failure" || "${{ needs.build-and-test.result }}" == "cancelled" ]]; then
            exit 1
          fi
