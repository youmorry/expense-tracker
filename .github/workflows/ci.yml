name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Check format (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check style (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Compile
        run: ./gradlew classes testClasses integrationTestClasses

      - name: Unit test
        run: ./gradlew test

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Build
        run: ./gradlew build
