name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI (Spectral)
        run: npx @stoplight/spectral-cli lint openapi.yaml

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Check format (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check style (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Compile
        run: ./gradlew classes testClasses integrationTestClasses

      - name: Unit test
        run: ./gradlew test

      - name: Integration test
        run: ./gradlew integrationTest

      - name: Build
        run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Compile (TypeScript)
        run: npx tsc -b

      - name: Build
        run: npm run build
