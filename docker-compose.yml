services:
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql

  mock-server:
    image: stoplight/prism:4
    ports:
      - "4010:4010"
    volumes:
      - ./backend/openapi.yaml:/tmp/openapi.yaml
    command: mock -h 0.0.0.0 --cors --errors /tmp/openapi.yaml

  scalar:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./backend/scalar.html:/usr/share/nginx/html/index.html
      - ./backend/openapi.yaml:/usr/share/nginx/html/openapi.yaml

volumes:
  db-data:
